# EveryCRED Integration Service mounted on the SHARED backend domain under
# a sub-path, alongside the main backend (/) and the audit service (/audit/).
#
# External path map (nginx strips /integration; uvicorn runs with
# --root-path /integration, set by ROOT_PATH in docker-compose.yml):
#   https://api-evrc.viitorcloud.in/integration/api/v1/...        -> the API
#   https://api-evrc.viitorcloud.in/integration/health/live|ready -> probes
#   https://api-evrc.viitorcloud.in/integration/docs | /redoc     -> only when
#       ENABLE_DOCS=true and ENVIRONMENT is not production; 404 otherwise
#
# The container publishes 127.0.0.1:8030 only, so this location is the one
# public way in.

# ---------------------------------------------------------------------------
# 1. Put this upstream at the TOP of api-evrc.viitorcloud.in.conf, OUTSIDE
#    any server { } block (upstream is only valid in the http context).
# ---------------------------------------------------------------------------
upstream integration_api {
    server 127.0.0.1:8030;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 2. Paste the blocks below INSIDE the existing `listen 443 ssl` server block
#    for api-evrc.viitorcloud.in. Do not create a second server block.
# ---------------------------------------------------------------------------

# Bare /integration has no trailing slash and would not match the prefix
# location below.
location = /integration {
    return 301 /integration/;
}

location /integration/ {
    # The trailing slash on proxy_pass strips the /integration prefix:
    #   /integration/api/v1/clients  ->  /api/v1/clients
    # Keep in sync with ROOT_PATH=/integration in docker-compose.yml.
    proxy_pass http://integration_api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /integration;
    # Pass the caller's X-Request-ID through unchanged; the service echoes
    # it (or generates one) so logs on both sides can be matched.

    # Requests are small JSON documents (connection inputs are capped at
    # 16 KB, settings at 16 KB). Overrides the server-level value here only.
    client_max_body_size 1m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # Above CONNECTOR_TIMEOUT_SECONDS (30 by default) so a slow provider
    # call ends with the service's own 502, not an nginx 504.
    proxy_read_timeout    75s;
}
